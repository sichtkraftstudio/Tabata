<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#090b0f">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Tabata">
  <meta name="description" content="Persönlicher Tabata-Wochenplan für Oberkörper und Bauch">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/icon-180.png">
  <link rel="stylesheet" href="style.css">
  <title>Tabata Woche</title>
</head>
<body>
  <header class="topbar">
    <div class="topbar-in">
      <a id="back" class="icon-btn" href="#/wochenplan" aria-label="Zurück" hidden>
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 6l-6 6 6 6"/></svg>
      </a>
      <h1 id="title">Start</h1>
    </div>
  </header>

  <main id="view"></main>

  <nav class="tabbar" aria-label="Hauptnavigation">
    <a href="#/start" data-tab="start">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 11l8-7 8 7"/><path d="M6 10v10h12V10"/><path d="M10 20v-5h4v5"/></svg>Start
    </a>
    <a href="#/training" data-tab="training">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 7v10M3.5 9.5v5M18 7v10M20.5 9.5v5M6 12h12"/></svg>Training
    </a>
    <a href="#/wochenplan" data-tab="wochenplan">
      <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="3"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>Wochenplan
    </a>
    <a href="#/fortschritt" data-tab="fortschritt">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 20v-9M12 20V4M19 20v-6"/></svg>Fortschritt
    </a>
    <a href="#/profil" data-tab="profil">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4 20c1-4 4-6 8-6s7 2 8 6"/></svg>Profil
    </a>
  </nav>

  <!-- Trainingsansicht (Vollbild) -->
  <section id="workout" class="workout" hidden>
    <div class="wo-top">
      <button class="icon-btn" id="wo-close" aria-label="Training abbrechen">✕</button>
      <div class="wo-meta"><span id="wo-ex"></span><span id="wo-round"></span></div>
      <span class="icon-btn-spacer"></span>
    </div>
    <div id="wo-bar" class="wo-bar" aria-hidden="true"></div>
    <div class="wo-body">
      <div class="wo-figure">
        <div id="wo-phase" class="wo-phase"></div>
      </div>
      <div class="wo-info">
        <h2 id="wo-name"></h2>
        <p id="wo-desc" class="muted"></p>
        <div id="wo-equip" class="equip-list"></div>
        <div class="ring">
          <svg viewBox="0 0 120 120" aria-hidden="true">
            <circle cx="60" cy="60" r="54" class="ring-bg"/>
            <circle cx="60" cy="60" r="54" class="ring-fg" id="wo-ring"/>
          </svg>
          <div class="ring-text" id="wo-time" role="timer"></div>
        </div>
        <div class="wo-controls">
          <button class="btn ghost" id="wo-abort">Abbrechen</button>
          <button class="btn primary big" id="wo-toggle">Start</button>
          <button class="btn ghost" id="wo-skip">Überspringen</button>
        </div>
      </div>
    </div>
  </section>

  <!-- Übungsdetails -->
  <dialog id="sheet" class="sheet">
    <div class="sheet-inner">
      <button class="icon-btn sheet-close" aria-label="Schließen">✕</button>
      <div id="sheet-body"></div>
    </div>
  </dialog>

  <!-- Übung ersetzen (Wochenplan) -->
  <dialog id="picker" class="sheet picker">
    <div class="sheet-inner">
      <button class="icon-btn sheet-close" aria-label="Schließen">✕</button>
      <div id="picker-body"></div>
    </div>
  </dialog>

  <script src="version.js"></script>
  <script src="texts.js"></script>
  <script src="exercises.js"></script>
  <script src="illustrations.js"></script>
  <script src="views.js"></script>
  <script src="app.js"></script>
</body>
</html>
